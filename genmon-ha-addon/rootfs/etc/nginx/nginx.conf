worker_processes 1;
pid /run/nginx.pid;
# crit: "connection refused" while genmon starts is expected and would flood the app log
error_log /dev/stderr crit;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;

    # Ingress runs inside an HA iframe, so allow same-origin framing (genserv sends frame-ancestors 'none')
    map $upstream_http_content_security_policy $ingress_csp {
        "~^(?<csp_pre>.*)frame-ancestors[^;]*(?<csp_post>.*)$" "${csp_pre}frame-ancestors 'self'${csp_post}";
        default $upstream_http_content_security_policy;
    }

    server {
        listen 8099 default_server;
        allow 172.30.32.2;
        deny all;

        client_max_body_size 50m;

        error_page 502 503 504 /genmon_unavailable.html;
        location = /genmon_unavailable.html {
            root /usr/share/genmon-ha;
            internal;
            sub_filter_once off;
            sub_filter "__INGRESS_PATH__" "$http_x_ingress_path";
        }

        location = /genmon_ha_status.json {
            alias /run/genmon/status.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            # sub_filter cannot rewrite compressed bodies (genserv uses flask-compress)
            proxy_set_header Accept-Encoding "";

            proxy_redirect ~^https?://[^/]+(/.*)$ $http_x_ingress_path$1;
            proxy_redirect ~^(/.*)$ $http_x_ingress_path$1;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy $ingress_csp always;

            # genmon uses a few root-absolute URLs; prefix them with the ingress path
            sub_filter_once off;
            sub_filter_types application/javascript text/javascript;
            sub_filter "'/cmd/" "'$http_x_ingress_path/cmd/";
            sub_filter "'/download/" "'$http_x_ingress_path/download/";
            sub_filter "'/mfa" "'$http_x_ingress_path/mfa";
            sub_filter "\"/mfa\"" "\"$http_x_ingress_path/mfa\"";
            sub_filter "'/passkey/" "'$http_x_ingress_path/passkey/";
            sub_filter "'/upload'" "'$http_x_ingress_path/upload'";
            sub_filter "'/send_otp'" "'$http_x_ingress_path/send_otp'";
            sub_filter "'/logout'" "'$http_x_ingress_path/logout'";
            sub_filter "'/sw.js'" "'$http_x_ingress_path/sw.js'";
        }
    }
}
